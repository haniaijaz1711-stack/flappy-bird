<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird HTML5</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            background: #70c5ce;
        }

        canvas {
            display: block;
            cursor: pointer;
        }

        .instructions {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="flappyCanvas" width="360" height="640"></canvas>
        <div class="instructions">Press SPACE / UP ARROW or CLICK / TAP to Jump</div>
    </div>

    <script>
        const canvas = document.getElementById("flappyCanvas");
        const ctx = canvas.getContext("2d");

        // Web Audio API context for retro sound effects
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'score') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // Game state variables
        let frames = 0;
        let score = 0;
        let highScore = parseInt(localStorage.getItem("flappy_highscore")) || 0;
        let gameState = "START"; // "START", "PLAY", "GAMEOVER"

        // Bird settings
        const bird = {
            x: 60,
            y: 250,
            w: 34,
            h: 24,
            radius: 12,
            gravity: 0.25,
            jump: 4.6,
            velocity: 0,
            rotation: 0,
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Rotate bird based on velocity
                if (gameState === "PLAY") {
                    this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.velocity * 0.08));
                }
                ctx.rotate(this.rotation);

                // Body (Yellow)
                ctx.fillStyle = "#f8e71c";
                ctx.beginPath();
                ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#000";
                ctx.stroke();

                // Belly (White)
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.ellipse(-2, 4, 10, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Eye
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(6, -4, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Pupil
                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.arc(8, -4, 2, 0, Math.PI * 2);
                ctx.fill();

                // Beak (Orange)
                ctx.fillStyle = "#f5a623";
                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(20, 3);
                ctx.lineTo(10, 7);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Wing
                ctx.fillStyle = "#e6c619";
                ctx.beginPath();
                let wingOffset = (gameState === "PLAY" && Math.floor(frames / 5) % 2 === 0) ? -4 : 0;
                ctx.ellipse(-6, wingOffset, 8, 5, Math.PI / 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            },

            update() {
                if (gameState === "START") {
                    // Hovering effect on start screen
                    this.y = 250 + Math.sin(frames * 0.08) * 5;
                    this.rotation = 0;
                } else {
                    this.velocity += this.gravity;
                    this.y += this.velocity;

                    // Floor boundary check
                    if (this.y + this.radius >= canvas.height - fg.h) {
                        this.y = canvas.height - fg.h - this.radius;
                        if (gameState === "PLAY") {
                            gameOver();
                        }
                    }

                    // Ceiling boundary check
                    if (this.y - this.radius <= 0) {
                        this.y = this.radius;
                        this.velocity = 0;
                    }
                }
            },

            flap() {
                this.velocity = -this.jump;
                playSound('jump');
            },

            reset() {
                this.y = 250;
                this.velocity = 0;
                this.rotation = 0;
            }
        };

        // Foreground / Ground
        const fg = {
            h: 112,
            x: 0,
            dx: 2,

            draw() {
                ctx.fillStyle = "#ded895";
                ctx.fillRect(0, canvas.height - this.h, canvas.width, this.h);

                // Top grass border
                ctx.fillStyle = "#73bf2e";
                ctx.fillRect(0, canvas.height - this.h, canvas.width, 15);
                ctx.fillStyle = "#599821";
                ctx.fillRect(0, canvas.height - this.h + 12, canvas.width, 3);

                // Moving ground stripes pattern
                ctx.strokeStyle = "#cbbd6b";
                ctx.lineWidth = 3;
                for (let i = this.x % 20; i < canvas.width; i += 20) {
                    ctx.beginPath();
                    ctx.moveTo(i, canvas.height - this.h + 15);
                    ctx.lineTo(i - 10, canvas.height);
                    ctx.stroke();
                }

                ctx.strokeStyle = "#000";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height - this.h);
                ctx.lineTo(canvas.width, canvas.height - this.h);
                ctx.stroke();
            },

            update() {
                if (gameState === "PLAY" || gameState === "START") {
                    this.x = (this.x - this.dx) % 20;
                }
            }
        };

        // Background (City skyline + clouds)
        const bg = {
            draw() {
                // Sky gradient
                let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#4ec0ca');
                gradient.addColorStop(0.7, '#70c5ce');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Clouds
                ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
                ctx.beginPath();
                ctx.arc(60, 380, 30, 0, Math.PI * 2);
                ctx.arc(90, 370, 40, 0, Math.PI * 2);
                ctx.arc(130, 380, 30, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(260, 360, 25, 0, Math.PI * 2);
                ctx.arc(290, 350, 35, 0, Math.PI * 2);
                ctx.arc(320, 360, 25, 0, Math.PI * 2);
                ctx.fill();

                // City Silhouette
                ctx.fillStyle = "#ccebaf";
                ctx.fillRect(30, 430, 40, 100);
                ctx.fillRect(100, 410, 50, 120);
                ctx.fillRect(180, 440, 45, 90);
                ctx.fillRect(260, 420, 60, 110);
            }
        };

        // Pipes manager
        const pipes = {
            position: [],
            w: 52,
            gap: 105,
            dx: 2,

            draw() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    let topY = p.y;
                    let bottomY = p.y + this.gap;

                    // Top Pipe
                    ctx.fillStyle = "#73bf2e";
                    ctx.fillRect(p.x, 0, this.w, topY);
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, 0, this.w, topY);

                    // Top Pipe Cap
                    ctx.fillRect(p.x - 3, topY - 20, this.w + 6, 20);
                    ctx.strokeRect(p.x - 3, topY - 20, this.w + 6, 20);

                    // Top Pipe Highlight & Shadow
                    ctx.fillStyle = "#9ce659";
                    ctx.fillRect(p.x + 4, 0, 4, topY - 20);
                    ctx.fillStyle = "#558822";
                    ctx.fillRect(p.x + this.w - 8, 0, 4, topY - 20);

                    // Bottom Pipe
                    let bottomHeight = canvas.height - fg.h - bottomY;
                    ctx.fillStyle = "#73bf2e";
                    ctx.fillRect(p.x, bottomY, this.w, bottomHeight);
                    ctx.strokeRect(p.x, bottomY, this.w, bottomHeight);

                    // Bottom Pipe Cap
                    ctx.fillRect(p.x - 3, bottomY, this.w + 6, 20);
                    ctx.strokeRect(p.x - 3, bottomY, this.w + 6, 20);

                    // Bottom Pipe Highlight & Shadow
                    ctx.fillStyle = "#9ce659";
                    ctx.fillRect(p.x + 4, bottomY + 20, 4, bottomHeight - 20);
                    ctx.fillStyle = "#558822";
                    ctx.fillRect(p.x + this.w - 8, bottomY + 20, 4, bottomHeight - 20);
                }
            },

            update() {
                if (gameState !== "PLAY") return;

                // Spawn pipes every 120 frames
                if (frames % 120 === 0) {
                    let minP = 80;
                    let maxP = canvas.height - fg.h - this.gap - 80;
                    let randomY = Math.floor(Math.random() * (maxP - minP + 1) + minP);
                    this.position.push({
                        x: canvas.width,
                        y: randomY,
                        passed: false
                    });
                }

                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];

                    // Move pipes
                    p.x -= this.dx;

                    // Collision Detection
                    let topPipeBottom = p.y;
                    let bottomPipeTop = p.y + this.gap;

                    // Check if bird is within pipe's horizontal bounds
                    if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + this.w) {
                        // Check vertical collision
                        if (bird.y - bird.radius < topPipeBottom || bird.y + bird.radius > bottomPipeTop) {
                            gameOver();
                        }
                    }

                    // Score increment
                    if (p.x + this.w < bird.x && !p.passed) {
                        score++;
                        p.passed = true;
                        playSound('score');
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem("flappy_highscore", highScore);
                        }
                    }

                    // Remove offscreen pipes
                    if (p.x + this.w < 0) {
                        this.position.shift();
                        i--;
                    }
                }
            },

            reset() {
                this.position = [];
            }
        };

        // User Interface overlay
        const ui = {
            draw() {
                ctx.fillStyle = "#FFF";
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 2;

                if (gameState === "START") {
                    // Title Screen
                    ctx.font = "bold 32px 'Segoe UI', sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("Flappy Bird", canvas.width / 2, 160);
                    ctx.strokeText("Flappy Bird", canvas.width / 2, 160);

                    // Play Badge / Button
                    ctx.fillStyle = "#e86100";
                    ctx.beginPath();
                    ctx.roundRect(canvas.width / 2 - 70, 310, 140, 50, 10);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = "#FFF";
                    ctx.font = "bold 20px 'Segoe UI', sans-serif";
                    ctx.fillText("TAP TO PLAY", canvas.width / 2, 342);

                } else if (gameState === "PLAY") {
                    // In-game score display
                    ctx.font = "bold 44px 'Segoe UI', sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(score, canvas.width / 2, 70);
                    ctx.strokeText(score, canvas.width / 2, 70);

                } else if (gameState === "GAMEOVER") {
                    // Game Over Box
                    ctx.fillStyle = "#ded895";
                    ctx.beginPath();
                    ctx.roundRect(canvas.width / 2 - 110, 170, 220, 170, 10);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = "#e86100";
                    ctx.font = "bold 26px 'Segoe UI', sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("GAME OVER", canvas.width / 2, 210);

                    // Score & High Score Text
                    ctx.fillStyle = "#000";
                    ctx.font = "16px 'Segoe UI', sans-serif";
                    ctx.textAlign = "left";
                    ctx.fillText("Score: " + score, canvas.width / 2 - 80, 255);
                    ctx.fillText("Best Score: " + highScore, canvas.width / 2 - 80, 290);

                    // Restart Button
                    ctx.fillStyle = "#4ec0ca";
                    ctx.beginPath();
                    ctx.roundRect(canvas.width / 2 - 60, 370, 120, 45, 8);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = "#FFF";
                    ctx.font = "bold 18px 'Segoe UI', sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("RESTART", canvas.width / 2, 398);
                }
            }
        };

        function gameOver() {
            if (gameState === "PLAY") {
                playSound('hit');
                gameState = "GAMEOVER";
            }
        }

        function resetGame() {
            bird.reset();
            pipes.reset();
            score = 0;
            frames = 0;
            gameState = "PLAY";
        }

        function handleInput() {
            initAudio();
            if (gameState === "START") {
                gameState = "PLAY";
                bird.flap();
            } else if (gameState === "PLAY") {
                bird.flap();
            } else if (gameState === "GAMEOVER") {
                resetGame();
            }
        }

        // Input Listeners
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                handleInput();
            }
        });

        canvas.addEventListener("click", (e) => {
            e.preventDefault();
            handleInput();
        });

        // Touch support for mobile devices
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            handleInput();
        }, { passive: false });

        // Main Loop
        function loop() {
            bg.draw();
            pipes.draw();
            pipes.update();
            fg.draw();
            fg.update();
            bird.draw();
            bird.update();
            ui.draw();

            frames++;
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
